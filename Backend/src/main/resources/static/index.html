<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskPilot API</title>
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            background: #0e1116;
            color: #e6edf3;
            display: grid;
            place-items: center;
        }
        main {
            max-width: 36rem;
            padding: 2rem;
            border: 1px solid #2b3340;
            border-radius: 10px;
            background: #151a21;
        }
        h1 { margin: 0 0 0.35rem; font-size: 1.25rem; }
        p { margin: 0 0 1rem; color: #9aa4b2; line-height: 1.5; }
        code { color: #c4b5fd; }
    </style>
</head>
<body>
    <main>
        <h1>TaskPilot API</h1>
        <p>This process serves the REST API and MCP endpoint. Open the React app at <code>http://localhost:5173</code> for the dashboard.</p>
        <p>Health: <code>GET /api/health</code>. MCP: <code>POST /mcp</code> (MCP 2025-11-25, Streamable HTTP JSON).</p>
    </main>
</body>
</html>
