# =============================================================================
# TaskPilot – Application Configuration
# =============================================================================

server.port=8080

# Application info
spring.application.name=TaskPilot

# =============================================================================
# MCP Server Configuration
# Streamable HTTP JSON-RPC endpoint: POST /mcp
# Protocol: MCP 2025-11-25
# =============================================================================
taskpilot.cors.allowed-origins=${TASKPILOT_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =============================================================================
# Gemini API Key
# Set via environment variable: export GEMINI_API_KEY=your_key_here
# Never hardcode your API key here.
# =============================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# =============================================================================
# Logging
# =============================================================================
logging.level.com.taskpilot=INFO
logging.level.org.springframework.ai=INFO
# Set to DEBUG for MCP protocol tracing:
# logging.level.org.springframework.ai.mcp=DEBUG

# =============================================================================
# Static resources (serves index.html at root)
# =============================================================================
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**
